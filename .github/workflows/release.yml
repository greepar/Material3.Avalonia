name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/Material3.Screenshots -c Release

  publish-nuget:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve and validate version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Release tag '$env:RELEASE_TAG' is not a supported SemVer tag."
          }
          $version = $Matches.version
          [xml]$project = Get-Content 'src/Material3.Avalonia/Material3.Avalonia.csproj'
          $projectVersion = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($projectVersion -ne $version) {
            throw "Tag version '$version' does not match project version '$projectVersion'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Pack NuGet package
        run: >-
          dotnet pack src/Material3.Avalonia/Material3.Avalonia.csproj
          -c Release
          -o artifacts/nuget

      - name: Verify package payload
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $package = "artifacts/nuget/Material3.Avalonia.$version.nupkg"
          $symbols = "artifacts/nuget/Material3.Avalonia.$version.snupkg"
          if (-not (Test-Path $package)) { throw "Missing $package" }
          if (-not (Test-Path $symbols)) { throw "Missing $symbols" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $package))
          try {
            $required = @(
              'lib/net8.0/Material3.Avalonia.dll',
              'lib/net8.0/Material3.Avalonia.xml',
              'README.md',
              'NOTICE'
            )
            foreach ($entry in $required) {
              if ($archive.Entries.FullName -notcontains $entry) { throw "Package is missing $entry" }
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Compile an independent package consumer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Path package-smoke | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ManagePackageVersionsCentrally>false</ManagePackageVersionsCentrally>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Material3.Avalonia" Version="PACKAGE_VERSION" />
            </ItemGroup>
          </Project>
          '@.Replace('PACKAGE_VERSION', $version) | Set-Content package-smoke/PackageSmoke.csproj
          @'
          <Application xmlns="https://github.com/avaloniaui"
                       xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
                       xmlns:m3="using:Material3.Avalonia"
                       x:Class="PackageSmoke.App">
            <Application.Styles>
              <m3:MaterialTheme SeedColor="#6750A4" />
            </Application.Styles>
          </Application>
          '@ | Set-Content package-smoke/App.axaml
          @'
          using Avalonia;
          namespace PackageSmoke;
          public sealed partial class App : Application { }
          '@ | Set-Content package-smoke/App.axaml.cs
          dotnet restore package-smoke/PackageSmoke.csproj --source artifacts/nuget --source https://api.nuget.org/v3/index.json
          dotnet build package-smoke/PackageSmoke.csproj -c Release --no-restore

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: greepar

      - name: Push package to NuGet.org
        run: >-
          dotnet nuget push
          artifacts/nuget/Material3.Avalonia.${{ steps.version.outputs.version }}.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push symbols to NuGet.org
        run: >-
          dotnet nuget push
          artifacts/nuget/Material3.Avalonia.${{ steps.version.outputs.version }}.snupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/nuget/*.*nupkg
          if-no-files-found: error

  publish-desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            archive: Material3.Gallery-win-x64.zip
          - os: windows-2025
            rid: win-arm64
            archive: Material3.Gallery-win-arm64.zip
          - os: ubuntu-24.04
            rid: linux-x64
            archive: Material3.Gallery-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            archive: Material3.Gallery-linux-arm64.tar.gz
          - os: macos-15-intel
            rid: osx-x64
            archive: Material3.Gallery-osx-x64.tar.gz
          - os: macos-15
            rid: osx-arm64
            archive: Material3.Gallery-osx-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld zlib1g-dev libfontconfig1-dev

      - name: Publish NativeAOT single file
        run: >-
          dotnet publish samples/Material3.Gallery/Material3.Gallery.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:DebugSymbols=false
          -p:DebugType=None
          -o publish/${{ matrix.rid }}

      - name: Remove debug symbols
        shell: pwsh
        run: |
          Get-ChildItem "publish/${{ matrix.rid }}" -Recurse -Include *.pdb,*.dbg,*.dSYM |
            Remove-Item -Recurse -Force

      - name: Archive Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, NOTICE "publish/${{ matrix.rid }}"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "${{ matrix.archive }}"

      - name: Archive Unix artifact
        if: runner.os != 'Windows'
        run: |
          cp README.md LICENSE NOTICE "publish/${{ matrix.rid }}"
          tar -C "publish/${{ matrix.rid }}" -czf "${{ matrix.archive }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish-musl:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-musl-x64
            archive: Material3.Gallery-linux-musl-x64.tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
            archive: Material3.Gallery-linux-musl-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish musl NativeAOT single file
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            sh -lc '
              set -eu
              apk add --no-cache build-base clang lld zlib-dev fontconfig-dev
              dotnet publish samples/Material3.Gallery/Material3.Gallery.csproj \
                -c Release \
                -r ${{ matrix.rid }} \
                --self-contained true \
                -p:DebugSymbols=false \
                -p:DebugType=None \
                -o publish/${{ matrix.rid }}
            '
          sudo chown -R "$(id -u):$(id -g)" publish

      - name: Remove debug symbols and archive artifact
        run: |
          find "publish/${{ matrix.rid }}" \( -name '*.pdb' -o -name '*.dbg' -o -name '*.dSYM' \) -exec rm -rf {} +
          cp README.md LICENSE NOTICE "publish/${{ matrix.rid }}"
          tar -C "publish/${{ matrix.rid }}" -czf "${{ matrix.archive }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish-wasm:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish WASM AOT
        run: >-
          dotnet publish samples/Material3.Gallery.Browser/Material3.Gallery.Browser.csproj
          -c Release
          -p:DebugSymbols=false
          -p:DebugType=None
          -o publish/wasm-aot

      - name: Remove debug symbols and archive artifact
        run: |
          find publish/wasm-aot -name '*.pdb' -delete
          cp README.md LICENSE NOTICE publish/wasm-aot/wwwroot
          cd publish/wasm-aot/wwwroot
          zip -r "$GITHUB_WORKSPACE/Material3.Gallery-wasm-aot.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-aot
          path: Material3.Gallery-wasm-aot.zip
          if-no-files-found: error

  release:
    needs:
      - publish-nuget
      - publish-desktop
      - publish-musl
      - publish-wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
